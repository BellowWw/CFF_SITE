<!DOCTYPE html>
<html>

<head>
    <title>Call For Freedom</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">CALL FOR FREEDOM</div>

        <nav>
            <a href="#">SHOP</a>
            <a href="#">ABOUT</a>
        </nav>
    </header>

    <main>

        <section class="hero">

            <p class="hero-small">HANDMADE IN GENEVA</p>

            <h1>
                CALL<br>
                FOR<br>
                FREEDOM
            </h1>

            <p class="hero-text">
                CLOTHES FOR PEOPLE WHO WANT FREEDOM..
            </p>

            <a class="hero-button" href="#">
                SEE THE SHIRTS →
            </a>

        </section>


        <section class="featured">

            <p class="featured-label">LATEST DROP</p>

            <div class="featured-shirt">

                <div class="frame">

                    <img
                        class="frame-art"
                        src="images/frame.svg"
                        alt=""
                    >

                    <div class="frame-opening">

                        <img
                            src="images/EyeP_F.png"
                            alt="Eye Puzzle shirt - front"
                        >

                    </div>

                </div>


                <div class="frame frame-back">

                    <img
                        class="frame-art"
                        src="images/frame.svg"
                        alt=""
                    >

                    <div class="frame-opening">

                        <img
                            src="images/EyeP_B.png"
                            alt="Eye Puzzle shirt - back"
                        >

                    </div>

                </div>

            </div>

            <h2>EYE PUZZLE</h2>

            <p>ONE SHIRT. TWO SIDES.</p>

        </section>

    </main>

</body>

</html>
