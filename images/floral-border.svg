<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Main curling stems -->
    <path d="M100 185
           C100 155 55 155 55 120
           C55 92 92 92 100 115
           C108 92 145 92 145 120
           C145 155 100 155 100 185" fill="none" stroke="#59483a" stroke-width="5" stroke-linecap="round"></path>

    <!-- Upper curls -->
    <path d="M100 115
           C82 95 65 82 75 65
           C82 52 97 60 92 72
           C88 82 78 77 80 70" fill="none" stroke="#59483a" stroke-width="4" stroke-linecap="round"></path>

    <path d="M100 115
           C118 95 135 82 125 65
           C118 52 103 60 108 72
           C112 82 122 77 120 70" fill="none" stroke="#59483a" stroke-width="4" stroke-linecap="round"></path>

    <!-- Leaves -->
    <g fill="#59483a">
        <ellipse cx="58" cy="105" rx="9" ry="20" transform="rotate(-45 58 105)"></ellipse>
        <ellipse cx="142" cy="105" rx="9" ry="20" transform="rotate(45 142 105)"></ellipse>

        <ellipse cx="72" cy="145" rx="9" ry="20" transform="rotate(-65 72 145)"></ellipse>
        <ellipse cx="128" cy="145" rx="9" ry="20" transform="rotate(65 128 145)"></ellipse>

        <ellipse cx="72" cy="78" rx="7" ry="16" transform="rotate(-55 72 78)"></ellipse>
        <ellipse cx="128" cy="78" rx="7" ry="16" transform="rotate(55 128 78)"></ellipse>
    </g>

    <!-- Central flower -->
    <g fill="#59483a">
        <circle cx="100" cy="50" r="9"></circle>

        <ellipse cx="100" cy="32" rx="8" ry="14"></ellipse>
        <ellipse cx="118" cy="50" rx="14" ry="8"></ellipse>
        <ellipse cx="100" cy="68" rx="8" ry="14"></ellipse>
        <ellipse cx="82" cy="50" rx="14" ry="8"></ellipse>
    </g>

    <!-- Flower centre -->
